[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "parity"
version = "0.1.0"
description = "Hard-Currency Return Model for Frontier Deals"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [
    { name = "Parity Contributors" }
]
dependencies = [
    "numpy>=1.26.0",
    "pandas>=2.1.0",
    "scipy>=1.11.0",
    "statsmodels>=0.14.0",
    "scikit-learn>=1.3.0",
    "pydantic>=2.5.0",
    "typer>=0.9.0",
    "pyyaml>=6.0",
    "matplotlib>=3.8.0",
    "openpyxl>=3.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
parity = "parity.cli:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
